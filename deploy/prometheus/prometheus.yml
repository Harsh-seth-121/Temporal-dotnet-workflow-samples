global:
  scrape_interval: 10s
  evaluation_interval: 10s

storage:
  tsdb:
    retention:
      # This box gets reset constantly, so the 15 day default would only ever
      # hold samples from a stack that no longer exists.
      #
      # Prometheus 3 deprecated the --storage.tsdb.retention.* flags in favour of
      # this field, so setting it on the command line warns instead of applying.
      time: 6h

scrape_configs:
  # Targets use compose service names and container-internal ports. The published
  # host ports are irrelevant between containers, and host.docker.internal only
  # works on Docker Desktop.
  - job_name: temporal-server
    static_configs:
      - targets: ['temporal:8000']
        labels:
          group: server
    # All four server roles share one registry and one endpoint in a
    # single-container deployment. They are separated by the service_name label,
    # whose values are frontend, history, matching and worker.

  - job_name: temporal-dotnet-worker
    static_configs:
      - targets: ['worker:9464']
        labels:
          group: sdk

  # The load generator only runs under the load profile, but Prometheus has no
  # notion of an optional target: a static config is scraped whether or not the
  # container exists. This job therefore shows DOWN on an idle box, and that is
  # the correct reading rather than a fault to chase.
  #
  # scrape_interval is 60s here rather than inheriting the global 10s because a
  # container that is not running is a DNS resolution failure, and at 10s that
  # failure lands in `make logs` six times a minute for as long as the box is up,
  # burying everything else worth reading. Panels over these series need a rate
  # window wide enough to hold several samples at this interval, not the [2m] the
  # 10s jobs use.
  - job_name: loadgen
    scrape_interval: 60s
    static_configs:
      - targets: ['loadgen:9095']
        labels:
          group: client

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
