apiVersion: 1

# Note the shape: apiVersion plus a providers list, with the directory under
# options.path. Older examples use a bare top-level list and options.folder,
# which modern Grafana ignores, leaving an empty dashboard list and no error.
providers:
  - name: sandbox
    orgId: 1
    folder: Temporal
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
