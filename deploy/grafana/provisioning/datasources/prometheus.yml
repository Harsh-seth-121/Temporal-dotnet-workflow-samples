apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Pinned rather than generated. Dashboards reference the datasource by uid,
    # and a generated one changes on every provision, leaving panels pointing at
    # a datasource that no longer exists.
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    orgId: 1
    # The vendored dashboard's datasource variable picks the default, and the
    # hand-built one relies on it too.
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 10s
